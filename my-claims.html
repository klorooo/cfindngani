<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Claims — CampusFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body data-root="" data-page="my-claims" data-area="user">
  <div id="cf-header"></div>
  <main class="container page">
    <div class="page-head">
      <div>
        <p class="eyebrow">Your activity</p>
        <h1>My Claims</h1>
      </div>
      <div class="head-actions">
        <a class="btn btn-primary" href="search.html?type=found">Find an item to claim</a>
      </div>
    </div>

    <div class="toolbar">
      <div class="tabs" role="group" aria-label="Filter claims">
        <button class="tab" type="button" data-filter="all" aria-pressed="true">All <span class="count">0</span></button>
        <button class="tab" type="button" data-filter="active" aria-pressed="false">Active <span class="count">0</span></button>
        <button class="tab" type="button" data-filter="closed" aria-pressed="false">Closed <span class="count">0</span></button>
      </div>
    </div>

    <div id="claims-list" class="claim-list" aria-live="polite"></div>
  </main>
  <div id="cf-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/search-match.js"></script>
  <script src="js/claims.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/my-claims.js"></script>
</body>
</html>
