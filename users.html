<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Users — CampusFind Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body data-root="../" data-page="users" data-area="admin">
  <div class="admin-shell">
    <aside class="sidebar" id="cf-sidebar" aria-label="Admin navigation"></aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <p class="eyebrow" style="margin-bottom:4px">Administration</p>
          <h1>Users</h1>
        </div>
        <button class="btn btn-ghost side-toggle" type="button" aria-label="Open menu">Menu</button>
      </div>
      <div class="tabs wrap" id="role-tabs" role="group" aria-label="Filter by role"></div>
      <div class="toolbar" style="margin-top:16px">
        <input class="input" type="search" id="f-q" placeholder="Search by name, email or ID number" aria-label="Search users">
        <select class="select" id="f-status" aria-label="Account status"><option value="">Any status</option><option value="active">Active</option><option value="disabled">Disabled</option></select>
      </div>
      <p class="muted small" id="result-count" aria-live="polite"></p>
      <div class="table-wrap">
        <table class="table admin-table">
          <thead><tr><th>Name</th><th>ID number</th><th>Email</th><th>Contact</th><th>Joined</th><th>Activity</th><th>Status</th><th><span class="sr-only">Actions</span></th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="empty" hidden></div>
      <div style="text-align:center;margin-top:18px"><button class="btn btn-ghost" type="button" id="show-more" hidden>Show more</button></div>

    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/reports.js"></script>
  <script src="../js/search-match.js"></script>
  <script src="../js/claims.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin-users.js"></script>
</body>
</html>
