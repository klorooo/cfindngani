<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in — CampusFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body data-root="" data-page="login" data-area="public">
  <div id="cf-header"></div>

  <main class="auth-wrap">
    <aside class="auth-aside">
      <p class="eyebrow" style="color:#e9c37d">Welcome back</p>
      <h2>Your lost-and-found, in one place.</h2>
      <ul>
        <li>Report a lost or found item in minutes</li>
        <li>See possible matches automatically</li>
        <li>Track the status of every claim</li>
      </ul>
    </aside>

    <section class="auth-main">
      <div class="auth-card">
        <h1>Log in</h1>
        <p class="muted">Use your CampusFind account to continue.</p>

        <div id="form-alert" class="alert" role="alert" hidden></div>

        <form id="login-form" class="form" novalidate style="margin-top:18px">
          <div class="field">
            <label for="email">Email address</label>
            <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            <div class="field-error" aria-live="polite"></div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="pw-wrap">
              <input class="input" id="password" name="password" type="password" autocomplete="current-password" required>
              <button class="pw-toggle" type="button" aria-pressed="false">Show</button>
            </div>
            <div class="field-error" aria-live="polite"></div>
          </div>
          <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
        </form>

        <p style="margin-top:18px">New to CampusFind? <a href="register.html">Create an account</a></p>


      </div>
    </section>
  </main>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
