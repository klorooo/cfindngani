<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Matches — CampusFind Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
</head>
<body data-root="../" data-page="matches" data-area="admin">
  <div class="admin-shell">
    <aside class="sidebar" id="cf-sidebar" aria-label="Admin navigation"></aside>

    <main class="admin-main">
      <div class="admin-topbar">
        <div>
          <p class="eyebrow" style="margin-bottom:4px">Administration</p>
          <h1>Matches</h1>
        </div>
        <button class="btn btn-ghost side-toggle" type="button" aria-label="Open menu">Menu</button>
      </div>
      <p class="muted" style="max-width:68ch;margin-top:-4px">The system suggests lost and found reports that look alike. Confirm a match to alert both reporters, or dismiss it. Reporters never see each other's contact details.</p>
      <div class="toolbar">
        <div class="tabs wrap" id="match-tabs" role="group" aria-label="Filter matches"></div>
        <button class="btn btn-ghost" type="button" id="refresh-btn">Refresh suggestions</button>
      </div>
      <details class="card link-card" id="link-panel">
        <summary>Link two reports by hand</summary>
        <form id="link-form" novalidate>
          <div class="link-grid">
            <div class="field"><label for="link-lost">Lost report</label><select class="select" id="link-lost"></select></div>
            <div class="field"><label for="link-found">Found report</label><select class="select" id="link-found"></select></div>
          </div>
          <p class="field-error" id="link-error" role="alert"></p>
          <button class="btn btn-primary btn-sm" type="submit">Link and confirm</button>
        </form>
      </details>
      <div id="match-list" class="match-list" aria-live="polite"></div>
    </main>
  </div>

  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/reports.js"></script>
  <script src="../js/search-match.js"></script>
  <script src="../js/claims.js"></script>
  <script src="../js/admin.js"></script>
  <script src="../js/layout.js"></script>
  <script src="../js/admin-matches.js"></script>
</body>
</html>
