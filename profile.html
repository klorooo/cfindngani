<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Profile — CampusFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body data-root="" data-page="profile" data-area="user">
  <div id="cf-header"></div>
  <main class="container page narrow">
    <p class="eyebrow">Account</p>
    <h1 style="font-size:2rem;margin-bottom:6px">My Profile</h1>
    <p class="muted" style="margin-bottom:24px" id="profile-sub"></p>

    <div class="stats-row" id="profile-stats"></div>

    <section class="card" style="margin-top:22px" aria-labelledby="details-h">
      <h2 id="details-h" style="font-size:1.25rem">Your details</h2>
      <form id="profile-form" class="form" novalidate>
        <div class="alert" id="profile-alert" role="alert" hidden></div>
        <div class="form-row">
          <div class="field"><label for="p-email">Email address</label><input class="input" id="p-email" type="email" disabled><span class="hint">Your email and role can't be changed. Ask an administrator if they're wrong.</span></div>
          <div class="field"><label for="p-role">Role</label><input class="input" id="p-role" type="text" disabled></div>
        </div>
        <div class="field"><label for="p-name">Full name</label><input class="input" id="p-name" name="name" type="text" autocomplete="name" maxlength="80" required><div class="field-error" aria-live="polite"></div></div>
        <div class="form-row">
          <div class="field"><label for="p-id" id="p-id-label">Student / employee ID</label><input class="input" id="p-id" name="idNumber" type="text" autocomplete="off" maxlength="30" required><div class="field-error" aria-live="polite"></div></div>
          <div class="field"><label for="p-contact">Mobile number</label><input class="input" id="p-contact" name="contact" type="tel" autocomplete="tel" placeholder="09171234567" required><div class="field-error" aria-live="polite"></div></div>
        </div>
        <p class="hint" style="margin:0 0 12px">Only administrators and people handling your claims can see your mobile number.</p>
        <button class="btn btn-primary" type="submit">Save changes</button>
      </form>
    </section>

    <section class="card" style="margin-top:22px" aria-labelledby="pw-h">
      <h2 id="pw-h" style="font-size:1.25rem">Change password</h2>
      <form id="password-form" class="form" novalidate>
        <div class="alert" id="password-alert" role="alert" hidden></div>
        <div class="field"><label for="pw-current">Current password</label><input class="input" id="pw-current" name="current" type="password" autocomplete="current-password" required><div class="field-error" aria-live="polite"></div></div>
        <div class="form-row">
          <div class="field"><label for="pw-new">New password</label><input class="input" id="pw-new" name="next" type="password" autocomplete="new-password" required><div class="field-error" aria-live="polite"></div></div>
          <div class="field"><label for="pw-confirm">Confirm new password</label><input class="input" id="pw-confirm" name="confirm" type="password" autocomplete="new-password" required><div class="field-error" aria-live="polite"></div></div>
        </div>
        <button class="btn btn-primary" type="submit">Update password</button>
      </form>
    </section>
  </main>
  <div id="cf-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/claims.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/profile.js"></script>
</body>
</html>
