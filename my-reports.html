<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Reports — CampusFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,700;1,9..144,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body data-root="" data-page="my-reports" data-area="user">
  <div id="cf-header"></div>
  <main class="container page">
    <div class="page-head">
      <div>
        <p class="eyebrow">Your activity</p>
        <h1>My Reports</h1>
      </div>
      <div class="head-actions">
        <a class="btn btn-lost" href="report-lost.html">Report lost</a>
        <a class="btn btn-found" href="report-found.html">Report found</a>
      </div>
    </div>

    <div class="toolbar">
      <div class="tabs" role="group" aria-label="Filter by type">
        <button class="tab" type="button" data-filter="all" aria-pressed="true">All <span class="count">0</span></button>
        <button class="tab" type="button" data-filter="lost" aria-pressed="false">Lost <span class="count">0</span></button>
        <button class="tab" type="button" data-filter="found" aria-pressed="false">Found <span class="count">0</span></button>
      </div>
      <label class="sr-only" for="q">Search your reports</label>
      <input class="input" type="search" id="q" placeholder="Search your reports…">
      <label class="sr-only" for="status-filter">Filter by status</label>
      <select class="select" id="status-filter">
        <option value="">Any status</option>
        <option value="open">Open</option>
        <option value="matched">Matched</option>
        <option value="claimed">Claimed</option>
        <option value="returned">Returned</option>
        <option value="withdrawn">Withdrawn</option>
      </select>
    </div>

    <div id="reports-grid" class="report-grid" aria-live="polite"></div>
  </main>
  <div id="cf-footer"></div>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/search-match.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/my-reports.js"></script>
</body>
</html>
